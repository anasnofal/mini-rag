name: Deploy main branch to server

on:
  push:
    banches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name:  Checkout code
        uses: action/checkout@v3

      - name: Deploy via SSh
        uses: applebot/ssh-action@v1.0.0
        with:
          host: ${{secrets.SSH_MAIN_HOST_IP}}
          username: githup_user
          key: ${{secrets.SSH_MAIN_PRIVATE_KEY}}
          script: |
            cd /home/githup_user/workspace/minirag
            git checkout main 
            git pull 
            sudo systemctl restart minirag.service
            echo "waiting"
            sleep 20
            for i in {1..6}; do
              if ss -tuln | grep -q ':80'; then
                echo "✅ Port 80 is now active."
                break
              else
                echo "⏳ Port 80 not ready yet. Retrying in 5 seconds..."
                sleep 5
              fi
            done

            if ! ss -tuln | grep -q ':80'; then
              echo "❌ Service failed to start on port 80"
              exit 1
            fi
